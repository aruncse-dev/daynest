# DayNest reminder pusher — Cloudflare Workers free plan (no card needed).
name = "daynest-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Wake every minute to send due reminders.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daynest-push"
database_id = "4b4340be-9168-4d66-baee-35a437f07e52"

